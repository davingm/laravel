name: Bug report
description: Report a reproducible problem in davingm/laravel
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues first. Do not include passwords, tokens, personal data, or production secrets.
  - type: input
    id: version
    attributes:
      label: Framework version
      description: Include the package version or commit you tested.
      placeholder: "A release tag or commit SHA"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include relevant PHP, Laravel, Composer, Node.js, operating system, and database versions.
      placeholder: "PHP 8.3, Laravel 13, Windows 11, SQLite"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Give the smallest complete sequence that demonstrates the issue.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include a sanitized error message or relevant output when available.
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Add screenshots or details that help reproduce the issue. Remove secrets and private data.
    validations:
      required: false
